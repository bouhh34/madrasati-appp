name: Install Ma Madrassa Production V4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-v4:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ma_madrassa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ma_madrassa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ma_madrassa_test
      RUNTIME_DATABASE_URL: postgresql://mm_runtime_test:runtime_test_password@127.0.0.1:5432/ma_madrassa_test
      RUN_DB_TESTS: '1'
      PASSWORD_PEPPER: ci-password-pepper-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      AUDIT_HMAC_KEY: ci-audit-hmac-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      BOOTSTRAP_SECRET: ci-bootstrap-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      APP_ORIGIN: http://localhost:10000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify V4 archive exists
        shell: bash
        run: |
          set -euo pipefail
          test -f MaMadrassa_Production_V4.zip
          test "$(stat -c%s MaMadrassa_Production_V4.zip)" -gt 100000

      - name: Extract V4 safely
        shell: python
        run: |
          import pathlib
          import shutil
          import zipfile

          archive = pathlib.Path(
              'MaMadrassa_Production_V4.zip'
          ).resolve()

          dest = pathlib.Path(
              '/tmp/mamadrassa_v4'
          ).resolve()

          shutil.rmtree(
              dest,
              ignore_errors=True
          )

          dest.mkdir(
              parents=True,
              exist_ok=True
          )

          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  target = (
                      dest / info.filename
                  ).resolve()

                  if (
                      target != dest
                      and dest not in target.parents
                  ):
                      raise SystemExit(
                          f'Unsafe ZIP path: {info.filename}'
                      )

              z.extractall(dest)

          root = (
              dest /
              'MaMadrassa_Production_V4'
          )

          required = [
              root / 'backend' / 'package.json',
              root / 'backend' / 'src' / 'server.js',
              root / 'backend' / 'migrations' / '001_core.sql',
              root / 'backend' / 'migrations' / '002_rls.sql',
              root / '.github' / 'workflows' / 'security-ci.yml',
              root / 'render.yaml',
          ]

          missing = [
              str(p)
              for p in required
              if not p.exists()
          ]

          if missing:
              raise SystemExit(
                  'Missing required V4 files: '
                  + ', '.join(missing)
              )

      - name: Replace legacy project with V4
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            /tmp/mamadrassa_v4/MaMadrassa_Production_V4/ ./

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and create lockfile
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-fund --no-audit

      - name: Static validation
        working-directory: backend
        run: npm run check

      - name: Run database migrations
        working-directory: backend
        run: npm run migrate

      - name: Run full test suite including PostgreSQL RLS isolation
        working-directory: backend
        run: npm test

      - name: Apply safe dependency fixes
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --omit=dev --no-fund || true
          npm run check
          npm test

      - name: Block high or critical production dependency vulnerabilities
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified V4
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            'Ma Madrassa Release Bot'

          git config user.email \
            'actions@users.noreply.github.com'

          git add -A

          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi

          git commit \
            -m 'Release Ma Madrassa Production V4'

          git push origin HEAD:main
